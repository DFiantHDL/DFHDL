name: Build

on:
  push:
    branches:
      - main
      - dev
      - scala_opencb
    paths-ignore:
      - 'docs/**'
      - 'docs_overrides/**'
      - 'properdocs.yml'
      - '.github/workflows/dfdocs.yml'
  pull_request:
    branches: 
      - main
      - dev
      - scala_opencb
    paths-ignore:
      - 'docs/**'
      - 'docs_overrides/**'
      - 'properdocs.yml'
      - '.github/workflows/dfdocs.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Scala
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:1.17.0.14
          apps: sbt bloop
      - name: Setup All Simulation Tools but NVC
        uses: YosysHQ/setup-oss-cad-suite@v3
      - name: Setup NVC
        uses: nickg/setup-nvc@v1
        with:
          version: latest
      - run: |
          verilator -version
          iverilog -V
          ghdl version
          nvc --version
      # DFTools runs each EDA tool inside a rootless Apptainer image, whose engine needs an
      # unprivileged user namespace. Ubuntu 24.04 blocks that via an AppArmor sysctl by default;
      # clear it so Apptainer's rootless engine can start.
      - name: Enable unprivileged user namespaces (Apptainer rootless engine)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Cache the DFTools Apptainer images (SIFs) across runs. scalapptainer stores them under
      # ~/.scalapptainer/images by content-addressed name, and both DFHDL and scalapptainer skip the
      # pull entirely when the SIF is already present, so restoring this folder removes the per-run
      # image downloads. Keyed on dftoolsVersion (build.sbt), which pins the exact image set; the
      # prefix restore-key lets a version bump reuse every unchanged (content-addressed) image.
      - name: Resolve DFTools version
        id: dftools
        run: |
          echo "version=$(sed -nE 's/^[[:space:]]*val dftoolsVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.sbt)" >> "$GITHUB_OUTPUT"
      - name: Cache DFTools images
        uses: actions/cache@v4
        with:
          path: ~/.scalapptainer/images
          key: dftools-images-${{ runner.os }}-${{ steps.dftools.outputs.version }}
          restore-keys: |
            dftools-images-${{ runner.os }}-
      - name: Run tests
        run: sbt test
      - name: Run app tests
        run: sbt testApps        